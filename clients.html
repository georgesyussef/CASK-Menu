<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASK - Digital Menu</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f59e0b">

    <!-- Anti-Cache Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Alpine JS -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>

            apiKey: "AIzaSyDVy6derGJrD8rWFcTc3roJlzQeOGBCyxA",
            authDomain: "cask-menu-eac48.firebaseapp.com",
            databaseURL: "https://cask-menu-eac48-default-rtdb.firebaseio.com",
            projectId: "cask-menu-eac48",
            storageBucket: "cask-menu-eac48.firebasestorage.app",
            messagingSenderId: "725740193174",

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
    </script>

    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-full font-sans antialiased flex flex-col bg-slate-50 text-slate-900 overflow-hidden"
      x-data="clientApp()" x-init="initClient()">

    <!-- Header Section -->
    <header class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 px-4 py-3 shadow-sm flex-shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3 flex-wrap sm:flex-nowrap">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="CASK Logo" class="w-10 h-10 sm:w-12 sm:h-12 object-contain drop-shadow" onerror="this.src='https://via.placeholder.com/48'">
                <div>
                    <h1 class="text-xl sm:text-2xl font-black text-amber-600 tracking-wider leading-none">CASK</h1>
                    <span class="text-[10px] sm:text-[11px] text-slate-500 uppercase tracking-widest font-bold">Restaurant & Lounge</span>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap justify-end w-full sm:w-auto">
                <!-- Track My Order Button -->
                <button @click="showTrackingModal = true" class="relative bg-amber-100 border border-amber-300 text-amber-800 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-sm hover:bg-amber-200 transition">
                    <i class="fa-solid fa-location-dot text-amber-600"></i>
                    <span>Track Order</span>
                    <span x-show="myActiveOrders.length > 0" class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                </button>

                <!-- Order Type Selection -->
                <div class="flex items-center gap-1 bg-slate-100 border border-slate-200 rounded-xl px-2.5 py-1.5">
                    <select x-model="orderType" class="bg-transparent text-xs sm:text-sm font-bold text-slate-800 outline-none cursor-pointer">
                        <option value="Dine-in">Dine-in</option>
                        <option value="Takeaway">Takeaway / Delivery</option>
                    </select>
                </div>

                <!-- Table Dropdown -->
                <div x-show="orderType === 'Dine-in'" class="w-full sm:w-auto flex items-center justify-center gap-1.5 bg-white border border-slate-200 rounded-xl px-3 py-1.5 shadow-sm mt-1 sm:mt-0">
                    <i class="fa-solid fa-chair text-amber-600 text-xs sm:text-sm"></i>
                    <select x-model="selectedTable" class="bg-transparent text-xs sm:text-sm font-bold text-slate-800 outline-none cursor-pointer text-center">
                        <template x-for="t in 20" :key="t">
                            <option :value="'Table ' + t" x-text="'Table ' + t"></option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Staff Calls Quick Actions -->
    <section x-show="orderType === 'Dine-in'" class="bg-white border-b border-slate-200 px-4 py-2 flex-shrink-0">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
            <button @click="sendStaffCall('Call Waiter')" class="flex-1 bg-slate-100 hover:bg-amber-500 hover:text-white text-slate-700 py-1.5 px-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-user-ninja text-amber-600"></i>
                <span>Call Waiter</span>
            </button>
            <button @click="sendStaffCall('Coal Change')" class="flex-1 bg-slate-100 hover:bg-amber-500 hover:text-white text-slate-700 py-1.5 px-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-fire text-amber-600"></i>
                <span>Shisha Coal</span>
            </button>
            <button @click="sendStaffCall('Request Bill')" class="flex-1 bg-slate-100 hover:bg-amber-500 hover:text-white text-slate-700 py-1.5 px-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-file-invoice-dollar text-amber-600"></i>
                <span>Get Bill</span>
            </button>
        </div>
    </section>

    <!-- MAIN BODY -->
    <div class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto">

        <!-- LEFT SIDEBAR CATEGORY MENU (DYNAMIC) -->
        <aside class="w-36 sm:w-60 bg-white border-r border-slate-200 overflow-y-auto flex-shrink-0 p-2 sm:p-3 space-y-3">
            
            <button @click="selectCategory('All', 'All')" 
                    :class="(selectedMainCategory === 'All' && selectedSubCategory === 'All') ? 'bg-amber-500 text-white font-black shadow-md' : 'bg-slate-100 text-slate-700 font-bold hover:bg-slate-200'"
                    class="w-full text-left px-3 py-2.5 rounded-xl text-xs flex items-center justify-between transition">
                <span>All Menu Items</span>
                <i class="fa-solid fa-utensils text-[10px]"></i>
            </button>

            <template x-for="group in dynamicMenuStructure" :key="group.mainCategory">
                <div class="space-y-1">
                    <button @click="selectMainCategory(group.mainCategory)"
                            :class="selectedMainCategory === group.mainCategory ? 'bg-amber-50 text-amber-800 font-black border-amber-300' : 'text-slate-800 font-extrabold hover:bg-slate-50 border-transparent'"
                            class="w-full text-left px-2.5 py-2 rounded-lg text-xs uppercase tracking-wider flex items-center justify-between border transition">
                        <span x-text="group.mainCategory"></span>
                        <i class="fa-solid" :class="openMainCategories.includes(group.mainCategory) ? 'fa-chevron-down' : 'fa-chevron-right'" class="text-[9px]"></i>
                    </button>

                    <div x-show="openMainCategories.includes(group.mainCategory)" class="pl-2 space-y-1">
                        <button @click="selectCategory(group.mainCategory, 'All')"
                                :class="(selectedMainCategory === group.mainCategory && selectedSubCategory === 'All') ? 'bg-amber-500 text-white font-black shadow-sm' : 'text-amber-700 font-bold hover:bg-amber-50'"
                                class="w-full text-left px-2.5 py-1 rounded-lg text-[11px] block transition truncate">
                            <span x-text="'All ' + group.mainCategory"></span>
                        </button>

                        <template x-for="subCat in group.subCategories" :key="subCat">
                            <button @click="selectCategory(group.mainCategory, subCat)"
                                    :class="(selectedMainCategory === group.mainCategory && selectedSubCategory === subCat) ? 'bg-amber-500 text-white font-black shadow-sm' : 'text-slate-600 hover:bg-slate-100 font-medium'"
                                    class="w-full text-left px-2.5 py-1.5 rounded-lg text-[11px] block transition truncate">
                                <span x-text="subCat"></span>
                            </button>
                        </template>
                    </div>
                </div>
            </template>
        </aside>

        <!-- RIGHT ITEMS CONTAINER -->
        <main class="flex-1 overflow-y-auto p-3 sm:p-5 space-y-4 pb-28">
            <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                <div>
                    <h2 class="text-base font-black text-slate-800 uppercase tracking-wide" x-text="selectedSubCategory !== 'All' ? selectedSubCategory : ('All ' + selectedMainCategory)"></h2>
                    <p class="text-[11px] text-slate-500" x-text="filteredMenuItems.length + ' Items Available'"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                <template x-if="filteredMenuItems.length === 0">
                    <div class="col-span-full py-12 text-center text-slate-400">
                        <i class="fa-solid fa-utensils text-3xl mb-2 block text-slate-300"></i>
                        <p class="text-xs font-semibold">No menu items available in this category.</p>
                    </div>
                </template>

                <template x-for="item in filteredMenuItems" :key="item.id">
                    <div class="bg-white border border-slate-200 rounded-2xl p-3.5 sm:p-4 flex gap-3 sm:gap-4 shadow-sm hover:shadow-md transition items-start">
                        <template x-if="item.image">
                            <img :src="item.image" alt="Item Image" 
                                 @click="openImageModal(item.image, item.name)"
                                 class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl border border-slate-100 flex-shrink-0 cursor-pointer hover:opacity-85 transition hover:scale-105 transform">
                        </template>

                        <div class="space-y-1 flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <h3 class="font-bold text-slate-900 text-sm sm:text-base leading-snug" x-text="item.name"></h3>
                                <template x-if="item.badge">
                                    <span class="bg-amber-100 text-amber-800 border border-amber-300 text-[9px] font-extrabold px-1.5 py-0.5 rounded-full" x-text="item.badge"></span>
                                </template>
                            </div>
                            
                            <template x-if="item.description">
                                <p class="text-[11px] text-slate-500 leading-relaxed whitespace-normal break-words block w-full py-0.5" x-text="item.description"></p>
                            </template>

                            <div class="pt-1 flex items-center justify-between gap-2 flex-wrap sm:flex-nowrap">
                                <span class="font-black text-amber-600 text-sm sm:text-base" x-text="'$' + Number(item.price).toFixed(2)"></span>

                                <template x-if="item.available">
                                    <div>
                                        <template x-if="!getItemCartCount(item.id)">
                                            <button @click="addToCart(item)" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1 rounded-xl text-xs transition shadow-sm flex items-center gap-1">
                                                <i class="fa-solid fa-plus text-[9px]"></i> Add
                                            </button>
                                        </template>
                                        <template x-if="getItemCartCount(item.id)">
                                            <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 rounded-xl p-1">
                                                <button @click="decrementItemCard(item.id)" class="w-5 h-5 rounded-lg bg-white text-slate-800 text-xs font-bold shadow-sm">-</button>
                                                <span class="text-xs font-bold text-amber-600 w-4 text-center" x-text="getItemCartCount(item.id)"></span>
                                                <button @click="addToCart(item)" class="w-5 h-5 rounded-lg bg-amber-500 text-white text-xs font-bold">+</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                
                                <template x-if="!item.available">
                                    <span class="text-[10px] font-bold bg-red-50 text-red-600 border border-red-200 px-2 py-0.5 rounded-lg">Sold Out</span>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </main>
    </div>

    <!-- Burger Combo Selection Modal (Fixed Regular Burger & Dynamic Extra Price) -->
    <div x-cloak x-show="showComboModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div @click.outside="showComboModal = false" class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-start border-b border-slate-100 pb-3">
                <div>
                    <h3 class="font-extrabold text-slate-900 text-base" x-text="selectedComboItem ? selectedComboItem.name : ''"></h3>
                    <p class="text-xs text-slate-500">Choose meal option:</p>
                </div>
                <button @click="showComboModal = false" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="space-y-3">
                <!-- Point 1 Fix: Changed Regular Sandwich -> Regular Burger -->
                <button @click="confirmAddToCart(selectedComboItem, false)" class="w-full bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-400 rounded-2xl p-4 text-left flex justify-between items-center transition group">
                    <div>
                        <span class="font-bold text-sm text-slate-800 group-hover:text-amber-700">Regular Burger</span>
                        <p class="text-[11px] text-slate-500">Served with fries aside</p>
                    </div>
                    <span class="font-black text-amber-600 text-sm" x-text="'$' + Number(selectedComboItem ? selectedComboItem.price : 0).toFixed(2)"></span>
                </button>

                <!-- Point 2 Fix: Uses dynamic comboExtraPrice -->
                <button @click="confirmAddToCart(selectedComboItem, true)" class="w-full bg-amber-50 hover:bg-amber-100 border-2 border-amber-400 rounded-2xl p-4 text-left flex justify-between items-center transition group">
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span class="font-black text-sm text-amber-900">Make it Combo</span>
                            <span class="bg-amber-500 text-white text-[9px] font-black px-2 py-0.5 rounded-full uppercase" x-text="'+ $' + comboExtraPrice.toFixed(2)"></span>
                        </div>
                        <p class="text-[11px] text-amber-800/80">Includes extra fries & soft drink</p>
                    </div>
                    <span class="font-black text-amber-700 text-base" x-text="'$' + (Number(selectedComboItem ? selectedComboItem.price : 0) + comboExtraPrice).toFixed(2)"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Floating Cart Bar -->
    <div x-cloak x-show="cartTotalCount > 0" class="fixed bottom-4 left-4 right-4 z-40 max-w-xl mx-auto">
        <button @click="showCartModal = true" class="w-full bg-amber-500 hover:bg-amber-600 text-white p-3.5 rounded-2xl font-black text-sm shadow-xl flex items-center justify-between border border-amber-300">
            <div class="flex items-center gap-3">
                <span class="bg-white text-amber-600 w-7 h-7 rounded-lg flex items-center justify-center text-xs font-black shadow" x-text="cartTotalCount"></span>
                <span>View Order</span>
            </div>
            <div class="flex items-center gap-2">
                <span x-text="'$' + cartTotalPrice.toFixed(2)"></span>
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </div>
        </button>
    </div>

    <!-- Cart Modal -->
    <div x-cloak x-show="showCartModal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm p-0 sm:p-4">
        <div @click.outside="showCartModal = false" class="bg-white border-t sm:border border-slate-200 rounded-t-3xl sm:rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl space-y-5 max-h-[92vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Your Order</h3>
                    <p class="text-xs text-amber-600 font-bold" x-text="orderType === 'Dine-in' ? selectedTable : 'Takeaway / Delivery'"></p>
                </div>
                <button @click="showCartModal = false" class="text-slate-400 hover:text-slate-700 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="overflow-y-auto space-y-2.5 flex-1 pr-1">
                <template x-for="cItem in cart" :key="cItem.cartItemId">
                    <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-200 gap-4">
                        <div>
                            <h4 class="font-bold text-sm text-slate-800" x-text="cItem.name"></h4>
                            <span class="text-xs text-amber-600 font-bold" x-text="'$' + (cItem.price * cItem.quantity).toFixed(2)"></span>
                        </div>
                        <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-xl p-1">
                            <button @click="updateCartQuantityByCartItemId(cItem.cartItemId, -1)" class="w-6 h-6 rounded-lg bg-slate-100 text-slate-800 text-xs font-bold">-</button>
                            <span class="text-xs font-bold text-amber-600 w-4 text-center" x-text="cItem.quantity"></span>
                            <button @click="updateCartQuantityByCartItemId(cItem.cartItemId, 1)" class="w-6 h-6 rounded-lg bg-amber-500 text-white text-xs font-bold">+</button>
                        </div>
                    </div>
                </template>
            </div>

            <div class="space-y-2 border-t border-slate-100 pt-3">
                <p class="text-xs font-bold text-slate-700">Customer Details:</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" x-model="customerInfo.name" placeholder="Your Name *" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none focus:border-amber-500">
                    <input type="tel" x-model="customerInfo.phone" placeholder="Phone Number *" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none focus:border-amber-500">
                </div>
                <template x-if="orderType === 'Takeaway'">
                    <input type="text" x-model="customerInfo.address" placeholder="Delivery Address..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none focus:border-amber-500">
                </template>
            </div>

            <div class="space-y-3 pt-2">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Notes / Special Requests</label>
                    <textarea x-model="orderNotes" placeholder="e.g. Extra sauce, no onions..." rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800 outline-none"></textarea>
                </div>

                <div class="flex justify-between items-center pt-2 text-base font-black border-t border-slate-100">
                    <span class="text-slate-700">Total</span>
                    <span class="text-amber-600" x-text="'$' + cartTotalPrice.toFixed(2)"></span>
                </div>

                <button @click="openConfirmModal()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-black py-3.5 rounded-xl text-sm transition shadow-md">
                    <span x-text="orderType === 'Dine-in' ? 'Send Order (Pending Approval)' : 'Confirm & Send via WhatsApp'"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Pre-Send Confirmation Modal -->
    <div x-cloak x-show="showConfirmModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4">
        <div @click.outside="showConfirmModal = false" class="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 shadow-2xl text-center space-y-4 max-h-[90vh] flex flex-col">
            <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl font-black flex-shrink-0">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            
            <div class="flex-shrink-0">
                <h3 class="text-base font-extrabold text-slate-900">Review Your Selected Items</h3>
                <p class="text-xs text-slate-500 mt-1">Please double check your order below:</p>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 text-left overflow-y-auto max-h-48 space-y-2 flex-1 my-1">
                <template x-for="cItem in cart" :key="cItem.cartItemId">
                    <div class="flex justify-between items-center text-xs text-slate-700 border-b border-slate-200/60 pb-2 last:border-b-0 last:pb-0">
                        <div class="font-medium pr-2">
                            <span class="font-bold text-amber-600" x-text="cItem.quantity + 'x'"></span>
                            <span x-text="cItem.name"></span>
                        </div>
                        <span class="font-bold text-slate-900 whitespace-nowrap" x-text="'$' + (cItem.price * cItem.quantity).toFixed(2)"></span>
                    </div>
                </template>
            </div>

            <div class="flex justify-between items-center px-1 font-black text-sm text-slate-900 flex-shrink-0 border-t border-slate-100 pt-2">
                <span>Total Amount:</span>
                <span class="text-amber-600 text-base" x-text="'$' + cartTotalPrice.toFixed(2)"></span>
            </div>

            <div class="flex-shrink-0 pt-1 space-y-3">
                <p class="text-xs text-slate-600 font-semibold leading-relaxed">
                    Do you want to edit anything in your items, or shall we send the order?
                </p>

                <div class="flex flex-col sm:flex-row gap-2">
                    <button @click="showConfirmModal = false; showCartModal = true;" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs transition order-2 sm:order-1">
                        ✏️ Edit Items
                    </button>
                    <button @click="confirmAndSubmitOrder()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl text-xs transition shadow-md order-1 sm:order-2">
                        🚀 Send Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Client Logic -->
    <script>
        function clientApp() {
            return {
                restaurantWhatsappPhone: '96171999867',
                comboExtraPrice: 3.00, // Combo Extra Fee (Ghayyera mn hon eza tghayyar l-se3er!)
                orderType: 'Dine-in',
                selectedTable: 'Table 1',
                selectedMainCategory: 'Food',
                selectedSubCategory: 'All',
                openMainCategories: ['Food', 'Beverages', 'Tobacco', 'Alcohol Drinks'],
                
                menuItems: [],
                cart: [],
                orderNotes: '',
                customerInfo: { name: '', phone: '', address: '' },
                showCartModal: false,
                showConfirmModal: false,
                showTrackingModal: false,
                showComboModal: false,
                showImageModal: false,
                selectedImageUrl: '',
                selectedImageTitle: '',
                selectedComboItem: null,
                allOrders: {},
                myOrderIds: JSON.parse(localStorage.getItem('cask_my_orders') || '[]'),

                // Dynamic Categories Generator
                get dynamicMenuStructure() {
                    const structureMap = {};
                    this.menuItems.forEach(item => {
                        const main = item.mainCategory || 'Food';
                        const sub = item.category || 'General';
                        if (!structureMap[main]) {
                            structureMap[main] = new Set();
                        }
                        structureMap[main].add(sub);
                    });

                    return Object.keys(structureMap).map(mainCat => ({
                        mainCategory: mainCat,
                        subCategories: Array.from(structureMap[mainCat])
                    }));
                },

                initClient() {
                    db.ref('menu').on('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data && data.length > 0) {
                            this.menuItems = data;
                        }
                    });

                    db.ref('orders').on('value', (snapshot) => {
                        this.allOrders = snapshot.val() || {};
                    });
                },

                confirmAddToCart(item, isCombo) {
                    if (!item) return;
                    const cartItemId = item.id + (isCombo ? '_combo' : '_regular');
                    const itemPrice = Number(item.price) + (isCombo ? this.comboExtraPrice : 0);
                    const itemName = item.name + (isCombo ? ' (Combo)' : '');

                    const idx = this.cart.findIndex(c => c.cartItemId === cartItemId);
                    if (idx !== -1) {
                        this.cart[idx].quantity += 1;
                    } else {
                        this.cart.push({
                            cartItemId: cartItemId,
                            id: item.id,
                            name: itemName,
                            price: itemPrice,
                            isCombo: isCombo,
                            quantity: 1
                        });
                    }
                    this.showComboModal = false;
                },

                addToCart(item) {
                    if (item.category === 'Burger') {
                        this.selectedComboItem = item;
                        this.showComboModal = true;
                    } else {
                        this.confirmAddToCart(item, false);
                    }
                },

                get filteredMenuItems() {
                    return this.menuItems.filter(item => {
                        if (this.selectedMainCategory === 'All' && this.selectedSubCategory === 'All') return true;
                        const itemMainCat = item.mainCategory || 'Food';

                        let matchMain = (this.selectedMainCategory === 'All' || itemMainCat === this.selectedMainCategory);
                        let matchSub = (this.selectedSubCategory === 'All' || item.category === this.selectedSubCategory);

                        return matchMain && matchSub;
                    });
                },

                getItemCartCount(itemId) {
                    return this.cart.filter(c => c.id === itemId).reduce((sum, c) => sum + c.quantity, 0);
                },

                decrementItemCard(itemId) {
                    for (let i = this.cart.length - 1; i >= 0; i--) {
                        if (this.cart[i].id === itemId) {
                            this.cart[i].quantity -= 1;
                            if (this.cart[i].quantity <= 0) this.cart.splice(i, 1);
                            break;
                        }
                    }
                    if (this.cart.length === 0) this.showCartModal = false;
                },

                updateCartQuantityByCartItemId(cartItemId, delta) {
                    const idx = this.cart.findIndex(c => c.cartItemId === cartItemId);
                    if (idx !== -1) {
                        this.cart[idx].quantity += delta;
                        if (this.cart[idx].quantity <= 0) this.cart.splice(idx, 1);
                    }
                    if (this.cart.length === 0) this.showCartModal = false;
                },

                get cartTotalCount() {
                    return this.cart.reduce((sum, item) => sum + item.quantity, 0);
                },

                get cartTotalPrice() {
                    return this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                },

                sendStaffCall(type) {
                    const reqId = Date.now();
                    db.ref('staff_calls/' + reqId).set({
                        id: reqId,
                        table: this.selectedTable,
                        type: type,
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    alert(type + ' request sent to staff!');
                },

                openConfirmModal() {
                    if (this.cart.length === 0) return;
                    if (!this.customerInfo.name.trim() || !this.customerInfo.phone.trim()) {
                        alert('Please enter your name and phone number to confirm the order!');
                        return;
                    }
                    this.showCartModal = false;
                    this.showConfirmModal = true;
                },

                confirmAndSubmitOrder() {
                    this.showConfirmModal = false;
                    this.submitOrder();
                },

                submitOrder() {
                    if (this.cart.length === 0) return;

                    const orderId = Date.now();
                    const orderObj = {
                        id: orderId,
                        type: this.orderType,
                        tableNumber: this.orderType === 'Dine-in' ? this.selectedTable : 'Takeaway / Delivery',
                        customerInfo: this.customerInfo,
                        items: [...this.cart],
                        total: this.cartTotalPrice,
                        notes: this.orderNotes,
                        status: 'Pending Approval',
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        timestampIso: new Date().toISOString()
                    };

                    this.myOrderIds.push(orderId);
                    localStorage.setItem('cask_my_orders', JSON.stringify(this.myOrderIds));
                    
                    db.ref('orders/' + orderId).set(orderObj);

                    if (this.orderType === 'Takeaway') {
                        let itemsText = this.cart.map(i => `${i.quantity}x ${i.name} ($${(i.price * i.quantity).toFixed(2)})`).join('\n');
                        let msg = `*New Order #${orderId}*\n*Name:* ${this.customerInfo.name}\n*Phone:* ${this.customerInfo.phone}\n*Address:* ${this.customerInfo.address}\n\n*Items:*\n${itemsText}\n\n*Total:* $${this.cartTotalPrice.toFixed(2)}`;
                        window.open(`https://wa.me/${this.restaurantWhatsappPhone}?text=${encodeURIComponent(msg)}`, '_blank');
                    }

                    alert('Order submitted successfully! Awaiting Admin approval.');
                    this.cart = [];
                    this.orderNotes = '';
                    this.showCartModal = false;
                    this.showTrackingModal = true;
                },

                openImageModal(url, title) {
                    this.selectedImageUrl = url;
                    this.selectedImageTitle = title || '';
                    this.showImageModal = true;
                },

                selectMainCategory(mainCat) {
                    this.selectedMainCategory = mainCat;
                    this.selectedSubCategory = 'All';
                    if (!this.openMainCategories.includes(mainCat)) {
                        this.openMainCategories.push(mainCat);
                    }
                },

                selectCategory(mainCat, subCat) {
                    this.selectedMainCategory = mainCat;
                    this.selectedSubCategory = subCat;
                },

                get myActiveOrders() {
                    return Object.values(this.allOrders)
                        .filter(o => this.myOrderIds.includes(o.id))
                        .reverse();
                }
            }
        }
    </script>
</body>
